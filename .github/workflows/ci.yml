name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0, net11.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore C4.Net.CI.slnf -p:TargetFramework=${{ matrix.framework }}

      - name: Build
        run: dotnet build C4.Net.CI.slnf --no-restore -c Release -p:TargetFramework=${{ matrix.framework }}

      - name: Test
        run: dotnet test C4.Net.CI.slnf --no-build -c Release -p:TargetFramework=${{ matrix.framework }}

  making-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore making app
        run: dotnet restore C4.Net.Renderer.Web/C4.Net.Renderer.Web.csproj

      - name: Build making app
        run: dotnet build C4.Net.Renderer.Web/C4.Net.Renderer.Web.csproj --no-restore -c Release -p:TargetFramework=net11.0

  mutation-test:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install Stryker
        run: dotnet tool install --tool-path ./.dotnet-tools dotnet-stryker

      - name: Run Stryker (informational)
        run: bash scripts/run-stryker.sh
